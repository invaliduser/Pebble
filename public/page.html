<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pebble</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <pre id="state"></pre>

  <script>
    const state = document.querySelector("#state");

    async function render() {
      state.textContent = await fetch("/state").then(r => r.text());
    }

    render().catch(e => state.textContent = String(e));
  </script>
</body>
</html>
